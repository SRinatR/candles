# docker-compose.yml
version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:16-alpine
    container_name: askim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: askim_candles_prod
      POSTGRES_USER: askim_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password_here}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - askim_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askim_user -d askim_candles_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askim_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # База данных
      DATABASE_URL: postgresql://askim_user:${POSTGRES_PASSWORD:-your_secure_password_here}@postgres:5432/askim_candles_prod?schema=public
      
      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your_nextauth_secret_here}
      
      # Google OAuth (если используется)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      
      # Дополнительные переменные окружения
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - askim_network
    volumes:
      # Для хранения загруженных файлов (если требуется)
      - uploaded_files:/app/public/uploads

  # Nginx как reverse proxy (опционально, для продакшена)
  nginx:
    image: nginx:alpine
    container_name: askim_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - askim_network

networks:
  askim_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploaded_files:
    driver: local
  nginx_logs:
    driver: local